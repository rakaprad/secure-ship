apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-ship
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-ship
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-ship
    spec:
      serviceAccountName: secure-ship
      automountServiceAccountToken: false
      # Must exceed SHUTDOWN_DELAY + the server's 15s shutdown timeout.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Tag is overridden per overlay; prod pins by digest.
          image: ghcr.io/rakaprad/secure-ship:0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ADDR
              value: ":8080"
            - name: BASE_URL
              value: "http://localhost:8080"
            - name: SHUTDOWN_DELAY
              value: "5s"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
